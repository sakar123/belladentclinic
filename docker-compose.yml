name: clinic-suite

services:
  db:
    build:
      context: ./clinic-db
      dockerfile: Dockerfile.DB
    container_name: clinic-db
    restart: unless-stopped
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5433"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - db
      - api
      - tests
      - portal

  api:
    container_name: clinic-api
    build:
      context: ./clinic-backend
      dockerfile: ClinicApi/Dockerfile.API
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use the service name 'db' as host inside the Docker network
      ConnectionStrings__clinicDbConnection: Host=db;Port=5433;Database=clinic_db;Username=clinic_backend_user;Password=pD7pr;
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - api
      - portal

  api-tests:
    container_name: clinic-api-tests
    build:
      context: ./clinic-backend
      dockerfile: ClinicApi.Tests/Dockerfile
    environment:
      ConnectionStrings__clinicDbConnection: Host=db;Port=5433;Database=clinic_db;Username=clinic_backend_user;Password=pD7pr;
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tests

  portal:
    container_name: clinic-portal
    build:
      context: ./clinic-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Use internal proxy to reach the API without browser CORS
      NEXT_PUBLIC_API_BASE_URL: /backend
      # Next.js runtime proxy target (server-side)
      API_PROXY_TARGET: http://api:8080
      # Auth0 config (override via env_file if available)
      AUTH0_BASE_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
    env_file:
      - ./clinic-portal/.env.local
    depends_on:
      - api
    profiles:
      - portal

  landing:
    container_name: clinic-landing
    build:
      context: ./clinic-landingpage
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    profiles:
      - landing

volumes:
  pgdata:
