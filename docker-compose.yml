name: clinic-suite

services:
  db:
    image: postgres:16-alpine
    container_name: clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_backend_user
      POSTGRES_PASSWORD: pD7pr
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Initialize schema and seed on first boot only
      - ./clinic-db/database-schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./clinic-db/insert-statement.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["db"]

  api:
    container_name: clinic-api
    build:
      context: .
      dockerfile: clinic-backend/Dockerfile
      target: api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use the service name 'db' as host inside the Docker network
      ConnectionStrings__clinicDbConnection: Host=db;Database=clinic_db;Username=clinic_backend_user;Password=pD7pr;
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      db:
        condition: service_healthy
    profiles: ["api"]

  api-tests:
    container_name: clinic-api-tests
    build:
      context: .
      dockerfile: clinic-backend/Dockerfile
      target: tests
    environment:
      ConnectionStrings__clinicDbConnection: Host=db;Database=clinic_db;Username=clinic_backend_user;Password=pD7pr;
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tests"]

  portal:
    container_name: clinic-portal
    build:
      context: ./clinic-portal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Use internal proxy to reach the API without browser CORS
      NEXT_PUBLIC_API_BASE_URL: /backend
      # Next.js runtime proxy target (server-side)
      API_PROXY_TARGET: http://api:8080
      # Auth0 config (override via env_file if available)
      AUTH0_BASE_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
    env_file:
      - ./clinic-portal/.env.local
    depends_on:
      - api
    profiles: ["portal"]

  landing:
    container_name: clinic-landing
    build:
      context: ./clinic-landingpage
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    profiles: ["landing"]

volumes:
  pgdata:
