name: Clinic Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'clinic-code/clinic-backend/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore clinic-code/clinic-backend/ClinicApi.sln

    - name: Build
      run: dotnet build clinic-code/clinic-backend/ClinicApi.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test clinic-code/clinic-backend/ClinicApi.sln --no-build --verbosity normal

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./clinic-code/clinic-backend
        dockerfile: ./clinic-code/clinic-backend/ClinicApi/Dockerfile.API
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/clinic-api:latest
