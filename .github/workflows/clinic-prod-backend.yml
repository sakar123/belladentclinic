name: Deploy ClinicApi (PROD) via S3 + SSM

on:
  push:
    branches: [ main ]
    paths:
      - 'ClinicApi/**'
      - '.github/workflows/deploy-clinicapi-prod.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::816684203948:role/GitHubDeployRole-Prod

  ARTIFACT_BUCKET: belladent-prod-deploy-artifacts
  INSTANCE_ID: i-0b1a3760dc3cda3d0

  APP_DIR: /opt/ClinicApi
  SERVICE_NAME: ClinicApi

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish (linux-arm64)
        run: |
          dotnet restore clinic-backend/ClinicApi/ClinicApi.csproj
          dotnet publish clinic-backend/ClinicApi/ClinicApi.csproj -c Release -r linux-arm64 --self-contained false -o publish

      - name: Package zip
        run: |
          cd publish
          zip -r ../ClinicApi_${{ github.sha }}.zip .
          cd ..

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          aws s3 cp "ClinicApi_${{ github.sha }}.zip" "s3://${{ env.ARTIFACT_BUCKET }}/clinicapi/ClinicApi_${{ github.sha }}.zip"

      - name: Deploy on EC2 via SSM
        run: |
          aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ClinicApi ${{ github.sha }}" \
            --parameters commands="[
              \"set -e\",
              \"cd /tmp\",
              \"aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/clinicapi/ClinicApi_${{ github.sha }}.zip ClinicApi.zip\",
              \"sudo systemctl stop ${{ env.SERVICE_NAME }} || true\",
              \"sudo rm -rf ${{ env.APP_DIR }}/*\",
              \"sudo unzip -o ClinicApi.zip -d ${{ env.APP_DIR }}\",
              \"sudo chown -R root:root ${{ env.APP_DIR }}\",
              \"sudo systemctl start ${{ env.SERVICE_NAME }}\",
              \"sudo systemctl status ${{ env.SERVICE_NAME }} --no-pager || true\"
            ]"

