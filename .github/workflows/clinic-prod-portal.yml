name: Clinic Portal CI/CD (AWS)

on:
  push:
    branches: [ main ]
    paths:
      - 'clinic-code/clinic-portal/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci
      working-directory: clinic-code/clinic-portal

    - name: Build
      run: npm run build
      working-directory: clinic-code/clinic-portal

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Deploy to S3
      run: aws s3 sync ./clinic-code/clinic-portal/out s3://${{ secrets.AWS_S3_BUCKET_NAME_PORTAL }} --delete

    - name: Invalidate CloudFront cache
      run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID_PORTAL }} --paths "/*"